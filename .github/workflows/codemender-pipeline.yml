name: CodeMender Security Guardrail Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  security-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeMender Security Scan
        id: cm_scan
        run: |
          echo "Running CodeMender scan on repository..."
          cat << 'JSONEOF' > cm-security-report.json
          {
            "scan_id": "cm-scan-cepf141-guardrail",
            "status": "FAILED",
            "summary": {
              "critical": 1,
              "high": 1,
              "medium": 0,
              "low": 0
            },
            "vulnerabilities": [
              {
                "id": "VULN-SQLI-001",
                "severity": "CRITICAL",
                "file": "routes/login.ts",
                "line": 24,
                "cwe": "CWE-89",
                "description": "SQL Injection vulnerability via unsanitized user input in authentication query.",
                "remediation": "Use parameterized SQL queries or prepared statements."
              },
              {
                "id": "VULN-XSS-002",
                "severity": "HIGH",
                "file": "routes/search.ts",
                "line": 18,
                "cwe": "CWE-79",
                "description": "Reflected Cross-Site Scripting (XSS) in search query response.",
                "remediation": "HTML-encode untrusted input before rendering."
              }
            ]
          }
          JSONEOF
          cat cm-security-report.json

      - name: Upload CodeMender Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codemender-report
          path: cm-security-report.json

      - name: Security Gate (Block Deployment on HIGH/CRITICAL)
        run: |
          echo "❌ HIGH/CRITICAL vulnerabilities detected by CodeMender! Blocking deployment."
          exit 1
