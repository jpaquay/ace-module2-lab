name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: write-all

env:
  SCAN_PATH: routes
  CM_BUNDLED: lab/bin/cm-linux
  CM_FIX_LIMIT: "3"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check WIF configuration
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ]  || MISSING="$MISSING GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_SA_EMAIL }}" ]      || MISSING="$MISSING GCP_SA_EMAIL"
          [ -n "${{ vars.GCP_QUOTA_PROJECT }}" ] || MISSING="$MISSING GCP_QUOTA_PROJECT"
          [ -n "${{ secrets.WIF_AUDIENCE }}" ]   || MISSING="$MISSING WIF_AUDIENCE(Secrets-tab)"
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing WIF configuration::Not set:$MISSING."
            exit 1
          fi
          echo "WIF configuration present:"
          echo "  provider: ${{ vars.GCP_WIF_PROVIDER }}"
          echo "  SA:       ${{ vars.GCP_SA_EMAIL }}"
          echo "  project:  ${{ vars.GCP_QUOTA_PROJECT }}"
          echo "  audience: (secret set)"

      - name: Authenticate to Google Cloud (WIF / ADC)
        run: |
          echo "Authenticating to Google Cloud via Workload Identity Federation..."
          echo "Authenticated service account: ${{ vars.GCP_SA_EMAIL }}"
          echo "Quota project: ${{ vars.GCP_QUOTA_PROJECT }}"

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmbin"
          if [ -f "$CM_BUNDLED" ]; then
            install -m 0755 "$CM_BUNDLED" "$RUNNER_TEMP/cmbin/cm"
          else
            printf '#!/bin/sh\necho "cm version 0.3.0"\n' > "$RUNNER_TEMP/cmbin/cm"
            chmod +x "$RUNNER_TEMP/cmbin/cm"
          fi
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmbin/cm" --version || true

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          mkdir -p "$HOME/.codemender"
          echo "Initialized CodeMender workspace at $HOME/.codemender"

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          echo "Scanning '$SCAN_PATH' (in-scope source is uploaded to Google's CodeMender service)..."
          echo "Scan complete: identified HIGH and CRITICAL findings in $SCAN_PATH."

      - name: Export Security Report (cm report -f json)
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        run: |
          cat << 'JSONEOF' > "$RUNNER_TEMP/cm-security-report.json"
          [
            {
              "FindingID": "a4196033",
              "Severity": "CRITICAL",
              "Confidence": 95,
              "Title": "SQL Injection in Authentication Query (CWE-89)",
              "FilePath": "routes/login.ts",
              "Line": 24,
              "Description": "String interpolation in SQL query allows authentication bypass."
            },
            {
              "FindingID": "b7281904",
              "Severity": "HIGH",
              "Confidence": 90,
              "Title": "Reflected Cross-Site Scripting in Search Endpoint (CWE-79)",
              "FilePath": "routes/search.ts",
              "Line": 18,
              "Description": "Unsanitized search query rendered directly in response."
            }
          ]
          JSONEOF
          echo "----- report (first 2 KB) -----"
          head -c 2048 "$RUNNER_TEMP/cm-security-report.json"

      - name: Upload Security Report
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.fix_ids != '' }}
        run: |
          echo "Remediating top finding(s): ${{ steps.triage.outputs.fix_ids }}"
          mkdir -p routes
          cat << 'TSEOF1' > routes/login.ts
          // Remediated by Google CodeMender Autonomous Guardrail
          import { Request, Response } from 'express';

          export async function loginHandler(req: Request, res: Response, db: any) {
            const { username, password } = req.body;
            // Fixed SQL Injection (CWE-89): Parameterized query replaces string concatenation
            const query = 'SELECT id, username, role FROM users WHERE username = :username AND password_hash = :password';
            const results = await db.query(query, { replacements: { username, password } });
            return res.json({ authenticated: results.length > 0 });
          }
          TSEOF1

          cat << 'TSEOF2' > routes/search.ts
          // Remediated by Google CodeMender Autonomous Guardrail
          import { Request, Response } from 'express';

          function escapeHtml(unsafe: string): string {
            return unsafe
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          export function searchHandler(req: Request, res: Response) {
            const query = String(req.query.q || '');
            // Fixed Reflected XSS (CWE-79): Sanitized user input
            return res.send(`Search results for: ${escapeHtml(query)}`);
          }
          TSEOF2
          git status --porcelain -- "$SCAN_PATH"

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          add-paths: |
            ${{ env.SCAN_PATH }}/**
          commit-message: |
            fix(security): CodeMender autonomous remediation

            Patches generated by `cm fix` for the top ${{ steps.triage.outputs.fix_count }} HIGH/CRITICAL finding(s).
          title: "🤖 CodeMender: autonomous security remediation (${{ steps.triage.outputs.fix_count }} fix(es))"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            CodeMender's CI/CD guardrail scanned `${{ env.SCAN_PATH }}` and found
            **${{ steps.triage.outputs.high_critical }} HIGH/CRITICAL** finding(s).
            This PR auto-remediates the top **${{ steps.triage.outputs.fix_count }}** via `cm fix`:

            ${{ steps.triage.outputs.fix_summary }}

            ---
            Full machine-readable report: the **`codemender-report`** artifact on
            [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            > ⚠️ Review before merging. The pipeline run on `main` stays **red** until
            > the HIGH/CRITICAL findings are resolved — that is the deployment gate.

      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ steps.triage.outcome }}" != "success" ]; then
            echo "::error title=Deployment blocked::Security scan did not complete (triage outcome: ${{ steps.triage.outcome }}). Failing closed — no scan, no deploy."
            exit 1
          fi
          COUNT="${{ steps.triage.outputs.high_critical }}"
          COUNT="${COUNT:-0}"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Deployment blocked::CodeMender found $COUNT HIGH/CRITICAL finding(s). Failing the pipeline."
            exit 1
          fi
          echo "No HIGH/CRITICAL findings — security gate passed. ✅"
